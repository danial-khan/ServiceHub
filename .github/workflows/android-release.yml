name: Android Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/android-release.yml'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Setup frontend node_modules symlink
        run: |
          cd frontend
          rm -rf node_modules
          ln -s ../node_modules node_modules
          ls -la node_modules/@react-native/gradle-plugin | head -5

      - name: Build shell bundle
        run: |
          cd frontend
          npm run build:shell
          # Copy bundle to Android assets
          mkdir -p android/app/src/main/assets
          cp build/shell/android/shell.bundle android/app/src/main/assets/index.android.bundle
          # Disable React Native bundling in Gradle
          echo "" >> android/gradle.properties
          echo "bundleInRelease=false" >> android/gradle.properties

      - name: Configure release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Release keystore secrets detected, configuring signing..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/android/app/release.keystore
          
          cat >> frontend/android/gradle.properties << EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Update signing configuration
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Update build.gradle to use release keystore when available
          sed -i '/release {/a\            signingConfig file("release.keystore").exists() ? signingConfigs.release : signingConfigs.debug' frontend/android/app/build.gradle
          
          # Add release signing config
          sed -i '/signingConfigs {/a\        release {\n            if (project.hasProperty("RELEASE_STORE_FILE")) {\n                storeFile file(project.property("RELEASE_STORE_FILE"))\n                storePassword project.property("RELEASE_STORE_PASSWORD")\n                keyAlias project.property("RELEASE_KEY_ALIAS")\n                keyPassword project.property("RELEASE_KEY_PASSWORD")\n            }\n        }' frontend/android/app/build.gradle

      - name: Build release APK
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=pr-${{ github.event.pull_request.number }}-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/release/app-release.apk release/ServiceHub-${VERSION}.apk
          ls -lh release/
          echo "APK_PATH=release/ServiceHub-${VERSION}.apk" >> $GITHUB_ENV
          stat -c "APK_SIZE=%s bytes (%s)" release/ServiceHub-${VERSION}.apk || stat -f "APK_SIZE=%z bytes" release/ServiceHub-${VERSION}.apk

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: release/ServiceHub-${{ steps.version.outputs.VERSION }}.apk
          body: |
            ## ServiceHub ${{ steps.version.outputs.VERSION }}
            
            Download the APK below to install on your Android device.
            
            **Note:** This APK is ${{ env.ANDROID_KEYSTORE_BASE64 != '' && 'signed with the release keystore' || 'signed with the debug keystore for testing purposes' }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServiceHub-${{ steps.version.outputs.VERSION }}.apk
          path: release/ServiceHub-${{ steps.version.outputs.VERSION }}.apk
          retention-days: 90
